[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-chart-replayer"
version = "0.1.0"
description = "Standalone historical trading chart replay terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
data = [
    "polars>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "yfinance>=0.2.40",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "integration: requires Qt/QWebEngine (headless offscreen)",
    "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"