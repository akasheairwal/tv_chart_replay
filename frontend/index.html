<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Chart Replayer</title>
    <!-- Qt ships qwebchannel.js through the qrc scheme inside QWebEngine.
         Outside the desktop shell (plain browser / tests) this tag fails to
         load; python-bridge.ts degrades gracefully to browser mode. -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="titlebar">
        <span class="app-title">Trading Chart Replayer</span>
        <span id="bridge-status" class="status-pill">connecting…</span>
      </header>
      <main id="main">
        <aside id="watchlist-panel" class="panel">
          <div class="panel-title">WATCHLIST</div>
          <div class="panel-empty">Wave 8</div>
        </aside>
        <section id="chart-area">
          <div id="chart-toolbar" class="toolbar"></div>
          <div id="chart-container"></div>
        </section>
      </main>
      <footer id="status-bar">ready</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
