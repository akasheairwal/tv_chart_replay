services:
  - type: web
    name: trading-chart-replayer-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn app.api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ORIGINS
        value: "*"

